<!doctype html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Lịch của tôi</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body><main class="app-shell"><header class="topbar"><div><p class="eyebrow">LỊCH CỦA TÔI</p><h1>Tháng 3, 2024</h1></div><button class="avatar" title="Đăng nhập để đồng bộ">NT</button></header><nav class="view-tabs"><button class="tab active" data-view="month">Tháng</button><button class="tab" data-view="list">Danh sách</button><button class="tab" data-view="week">Tuần</button><button class="tab" data-view="day">Ngày</button></nav><section class="calendar-card" id="month-view"><div class="calendar-header"><button class="round-btn" id="previous">‹</button><strong id="calendar-title">THÁNG 3, 2024</strong><button class="round-btn" id="next">›</button></div><div class="weekdays"><span>T2</span><span>T3</span><span>T4</span><span>T5</span><span>T6</span><span>T7</span><span>CN</span></div><div class="calendar-grid" id="calendar-grid"></div></section><section id="week-view" class="alternate-view hidden"></section><section id="day-view" class="alternate-view hidden"></section><section class="agenda" id="agenda-view"><div class="section-heading"><div><p class="eyebrow" id="agenda-date">THỨ HAI, 04 THÁNG 3</p><h2 id="agenda-heading">Lịch hôm nay</h2></div><button class="filter-btn" id="filter-button" title="Lọc sự kiện">☷</button></div><div class="events" id="events"></div></section><button class="add-event" id="add-event" title="Thêm sự kiện">+</button><nav class="bottom-nav"><button class="nav-item selected"><span>▣</span>Lịch</button><button class="nav-item"><span>✓</span>Công việc</button><button class="nav-item"><span>◉</span>Thống kê</button><button class="nav-item"><span>☻</span>Cá nhân</button></nav></main><dialog id="event-dialog"><form id="event-form" class="dialog-content"><button class="close" type="button" id="close-dialog">×</button><p class="eyebrow">CÔNG VIỆC MỚI</p><h2>Thêm vào lịch</h2><label>Tên công việc<input id="event-name" placeholder="Ví dụ: Họp nhóm" required></label><label>Ngày thực hiện<input id="event-date" type="date" required></label><label>Thời gian<input id="event-time" type="time" value="09:00" required></label><label>Mô tả<input id="event-description" placeholder="Ví dụ: Chuẩn bị nội dung cuộc họp"></label><button class="save" type="submit">Lưu công việc</button></form></dialog><script type="module" src="script.js"></script></body></html>
<!-- Thêm thư viện confetti ngay trước script.js -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
